{% extends "auctions/layout.html" %}

{% block body %}

    <h2>Create a new listing</h2>

    <!-- TODO: Add a message for invalid URL -->
    <div>{{ message }}</div>   

    <form action="{% url 'listing' %}" method="post">
        {% csrf_token %}
        <!-- A title for the listing, -->
        <div class="form-group">
            <input autofocus class="form-control"
                type="text"
                name="title"
                placeholder="Title of the listing">
        </div>
        <!-- A text-based description, and -->
        <div class="form-group">    
            <!-- <input class="form-control form-control-sm" type="text" name="description" placeholder="Description of the listing">   -->
            <textarea class="form-control"
                type="text"
                name="description"
                placeholder="Description of the listing"
                rows="3"></textarea>
        </div>
        <!-- What the starting bid should be. -->
        <div class="form-group">
            <input type="number"
                class="form-control"
                name="starting_bid"
                placeholder="Starbing bid value ($)"
                min="0.00" step="0.01"
        ></div>
        <!-- Category. -->
        <div class="form-group">
            <select class="form-control"
                name="category">
                    <option value="">Category</option>    
                    <option value="electronics">Electronics</option>
                    <option value="fashion">Fashion</option>
                    <option value="collectibles">Collectibles</option>
                    <option value="toys">Toys</option>
            </select>
        </div>
        <!-- URL Image -->
        <div class="form-group">
            <input type="url"
                class="form-control"
                name="url_image"
                value="http"
                placeholder="Enter URL (optional)"
        ></div>

        <input class="btn btn-primary" type="submit" value="Submit this listing">
    </form>

    <!-- Don't have an account? <a href="{% url 'register' %}">Register here.</a> -->

{% endblock %}
